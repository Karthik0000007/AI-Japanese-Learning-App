# One-command start:          docker compose up --build
# With the AI tutor (Ollama): docker compose --profile ai up --build
#
# Local development only: the default database password is "postgres".
# Override it with POSTGRES_PASSWORD in your shell or a .env file next to this one.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: jlpt_trainer
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jlpt_trainer"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    # No published port: only the app talks to the database.

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/jlpt_trainer
      # Resolves only when the 'ai' profile is on; otherwise the tutor answers 503.
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1:8b}
    ports:
      - "127.0.0.1:8000:8000"   # reachable from this machine only
    restart: unless-stopped

  ollama:
    image: ollama/ollama
    profiles: ["ai"]
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # One-off job: downloads the tutor model (~4.9 GB for llama3.1:8b) on the
  # first run; later runs find it in the 'ollama' volume and finish at once.
  ollama-pull:
    image: ollama/ollama
    profiles: ["ai"]
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: ollama:11434
    entrypoint: ["ollama", "pull", "${OLLAMA_MODEL:-llama3.1:8b}"]
    restart: "no"

volumes:
  pgdata:
  ollama:
